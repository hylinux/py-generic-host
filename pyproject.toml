[project]
name = "py-generic-host"
version = "0.1.0"
description = "Production-ready Python Generic Host Framework (.Net Style) With FastAPI + Opentelemetry"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [ { name = "HongWei Guo" } ]

dependencies = [
    "aiolimiter>=1.2.1",
    "dependency-injector>=4.49.1",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-exporter-prometheus>=0.64b0",
    "opentelemetry-instrumentation-asyncio>=0.64b0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-logging>=0.64b0",
    "opentelemetry-instrumentation-redis>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-instrumentation-system-metrics>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-semantic-conventions>=0.64b0",
    "prometheus-client>=0.25.0",
    "purgatory>=3.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
    "starlette>=1.3.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.49.0",
    "watchfiles>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
py-generic-host = "app.main:run"


[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"


[tool.hatch.build.targets.wheel]
packages = ["src/py_generic_host", "app"]


# ---------- Ruff ----------
[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "app"]

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","ASYNC","S","SIM","RUF"]
ignore = ["S101"] # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","B"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"

addopts = "-ra -q --strict-markers --cov=src/py_generic_host --cov=app --cov-report=term-missing"
testpaths = ["tests"]
